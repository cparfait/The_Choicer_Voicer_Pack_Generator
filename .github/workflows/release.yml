# Fabrique l'executable Windows et le publie dans une release GitHub.
#
# Declenche par un tag de version :
#     git tag v1.0.0 && git push origin v1.0.0
#
# Le .zip produit contient l'outil, son interface et ffmpeg : rien a installer
# pour celui qui le telecharge. Les fonctions IA (torch) restent dehors — elles
# pesent plus d'un giga et s'obtiennent en indiquant un Python dans Reglages.

name: Executable Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # bouton « Run workflow », pour essayer sans publier

permissions:
  contents: write           # necessaire pour creer la release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart yt-dlp pyinstaller

      # Variante « lgpl-shared » : elle a libtheora, libvorbis et libmp3lame —
      # tout ce dont l'outil se sert — pour trois fois moins lourd que la
      # variante gpl statique.
      - name: ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV
          & "$bin\ffmpeg.exe" -hide_banner -encoders | Select-String libtheora
        shell: pwsh

      - name: Construction
        run: python build_exe.py --ffmpeg "$env:FFMPEG_BIN"
        shell: pwsh

      # Verification minimale : l'outil demarre et repond avant d'etre publie.
      - name: Verification au demarrage
        run: |
          $exe = "dist\ChoicerVoicerPackMaker\ChoicerVoicerPackMaker.exe"
          $p = Start-Process $exe -ArgumentList "--port","8799","--no-browser" -PassThru
          Start-Sleep -Seconds 20
          try {
            $boot = Invoke-RestMethod "http://127.0.0.1:8799/api/bootstrap" -TimeoutSec 30
            if (-not $boot.frozen) { throw "l'executable ne se reconnait pas comme tel" }
            # @(...) est indispensable : sans lui PowerShell enumere les
            # proprietes et renvoie le Count de chacune, soit « 1 1 1 1 1 1 1 ».
            if (@($boot.specs.PSObject.Properties).Count -lt 7) { throw "types de packs manquants" }
            # L'etat des outils externes n'est plus dans /api/bootstrap, qui
            # repond tout de suite : il se demande a /api/tools.
            $outils = Invoke-RestMethod "http://127.0.0.1:8799/api/tools" -TimeoutSec 120
            if (-not $outils.tools.ffmpeg.ok) { throw "ffmpeg embarque non fonctionnel" }
            if (-not $outils.tools.ffprobe.ok) { throw "ffprobe embarque non fonctionnel" }
            "ffmpeg : $($outils.tools.ffmpeg.version)"
          } finally {
            Stop-Process -Id $p.Id -Force
          }
        shell: pwsh

      - name: Archive
        run: |
          # La verification a fait naitre un data/ vide : il n'a rien a faire
          # dans l'archive, l'outil le recree au premier lancement.
          Remove-Item -Recurse -Force dist\ChoicerVoicerPackMaker\data -ErrorAction SilentlyContinue
          $nom = "ChoicerVoicerPackMaker-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist\ChoicerVoicerPackMaker\* -DestinationPath $nom
          "ARCHIVE=$nom" >> $env:GITHUB_ENV
          "{0:N0} Mo" -f ((Get-Item $nom).Length / 1MB)
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ChoicerVoicerPackMaker-win64
          path: ${{ env.ARCHIVE }}

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            ## Download

            **[${{ env.ARCHIVE }}](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.ARCHIVE }})**

            Unzip the folder wherever you like and run `ChoicerVoicerPackMaker.exe`.
            ffmpeg is included, there is nothing to install. Your projects are
            stored in `data/`, next to the executable.

            Windows may show a SmartScreen warning, as the executable is not
            signed: *More info* then *Run anyway*.

            ### What it does

            Turns any video into a playable The Choicer Voicer content pack:
            downloads it, splits the audio into lines using the subtitles (or the
            silences), grabs one still per clip, converts the video to OGV/Theora
            for the game engine, and installs the pack straight into the game.
            All seven pack types are covered. Interface in English, French and
            Spanish.

            ### AI features

            Transcription, backing track, speaker detection and cutting characters
            out rely on libraries weighing over a gigabyte: they are **not** in the
            archive. To use them, install them into any Python and point
            **Settings → AI features** at it:

            ```
            pip install faster-whisper demucs pyannote.audio rembg onnxruntime opencv-python-headless
            ```

            ---

            ### En francais

            Decompresse le dossier ou tu veux, lance `ChoicerVoicerPackMaker.exe` :
            ffmpeg est inclus, rien a installer, et tes projets se rangent dans
            `data/` a cote de l'executable. Les quatre fonctions IA ne sont pas
            dans l'archive — indique dans **Reglages** un Python qui les possede.
            Details dans le [README francais](https://github.com/${{ github.repository }}/blob/main/README.fr.md).
